name: Laravel Deploy

on:
  push:
    branches:
      - main

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

    - name: Deploy Laravel

      uses: appleboy/ssh-action@v1

      with:

        host: ${{ secrets.SERVER_HOST }}

        username: deploy

        key: ${{ secrets.SERVER_KEY }}

        script: |

          cd /var/www/.uat/apps

          ./deploy.sh